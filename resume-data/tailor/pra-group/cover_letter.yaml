        analysis — consistent with the analytical work described in your job posting.
      - >
        My master's profile in Investment and Finance means I approach
        modelling problems with an understanding of the investment logic behind them, not just
        the statistics. I find the combination of rigorous data work and direct impact on
        investment decisions genuinely motivating.
      - >
        The Analytical Labs initiative and the Python-exclusive modelling stack are
        particularly appealing. I would welcome the opportunity to discuss how I can
        contribute to the team.
