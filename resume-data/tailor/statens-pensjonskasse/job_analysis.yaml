    experience_focus: 'Fremhev masteroppgave (dyp læring + RL + usikkerhet i Python) og NTNU ML-kurs (XGBoost, AutoGluon). Kystverket viser profesjonell ML i offentlig kontekst.'
    project_relevance: 'Masteroppgave er stjerneprosjektet – uncertainty-aware prediksjon med BNN og PPO. TDT4173/4259 viser klassisk ML-erfaring fra feature engineering til evaluering.'

