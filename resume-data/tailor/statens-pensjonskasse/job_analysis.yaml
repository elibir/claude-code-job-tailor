      - 'Masteroppgave inkluderer dyp læring (BNN) – dekker "gjerne også dyp læring"-kravet'
      - 'GitHub Actions CI/CD → MLOps-grunnlag (reproduserbarhet, versjonering)'
    emphasis_strategy: 'Fremhev masteroppgaven som bevis på end-to-end ML-arbeid med dyp læring og usikkerhetskvantifisering. Koble TDT4173/4259 eksplisitt til prediktive modeller og tidsseriedata. Kystverket viser ML i offentlig sektor.'

