independent_projects:
  - name: 'Fondsoversikt'
    location: 'Personlig prosjekt'
    duration: '2026'
    url: 'https://fondsoversikt-app.azurewebsites.net/'
    description: >
      Utviklet en fullstack web-applikasjon som henter inn data fra ulike fond, rangerer dem med en
      egenutviklet scoringalgoritme og presenterer resultatet for brukeren i et oversiktlig grensesnitt.
    achievements:
      - 'Bygde REST API med Python og FastAPI for innhenting og scoring av fonddata fra eksterne kilder.'
      - 'Utviklet React-frontend som visualiserer og rangerer fond basert på scoringalgoritmen.'
      - 'Satte opp automatisk bygg og deploy til Azure via GitHub Actions CI/CD-pipeline.'
      - 'Leverte en fungerende ende-til-ende løsning tilgjengelig på nett.'
      - 'Brukte Claude Code som AI-kodingsassistent gjennom hele utviklingsprosessen.'

  - name: 'Masteroppgave: A Two-Stage Deep Learning Framework for Uncertainty-Aware Bitcoin Forecasting and Trading'
    location: 'NTNU, Trondheim'
    duration: '2025'
    description: >
      Utviklet et to-stegs rammeverk for prediksjon av Bitcoin-prisen og automatisert handel under
      usikkerhet, med fokus på usikkerhetskvantifisering og praktisk anvendelse innenfor finans.
    achievements:
      - 'Designet et Bayesiansk nevralt nettverk i Python for prediksjon av Bitcoin-prisen med usikkerhetsestimater.'
      - 'Implementerte en Proximal Policy Optimization (PPO) reinforcement learning-algoritme for automatisert handel basert på prediksjonene.'
      - 'Kombinerte prediktiv modellering med beslutningstaking under usikkerhet i et ende-til-ende-rammeverk for finansielle tidsserier.'

  - name: 'Turplanleggingsapp – Programvareutvikling (TDT4140)'
    location: 'NTNU, Trondheim'
    duration: '2022'
    description: >
      Teamprosjekt med utvikling av en fullstack web-applikasjon for arrangering av turer i naturen.
    achievements:
      - 'Implementerte brukerautentisering (registrering og innlogging) og tilgangsstyring.'
      - 'Bygde funksjonalitet for å opprette, administrere og melde seg på turer.'
      - 'Bidro til utvikling av frontend i React med TypeScript.'
      - 'Jobbet etter agile arbeidsmetoder med kodegjennomganger og versjonskontroll via Git.'

  - name: 'Store, distribuerte datamengder (TDT4225)'
    location: 'NTNU, Trondheim'
    duration: '2024'
    description: >
      Selvstendig prosjekt med design og implementering av databasesystemer for store datamengder.
    achievements:
      - 'Designet og utviklet databaser i SQL (MySQL) og NoSQL (MongoDB) for store datamengder.'
      - 'Satte opp og konfigurerte databasene lokalt med Docker.'
      - 'Gjennomførte data analytics og komplekse spørringer mot databasene med Python.'

  - name: 'Maskinlæring – Prediksjon av strømproduksjon (TDT4173)'
    location: 'NTNU, Trondheim'
    duration: '2023'
    description: >
      Teamarbeid med maskinlæring for prediksjon av strømproduksjon fra solceller basert på værdata.
    achievements:
      - 'Trente og evaluerte Random Forest, XGBoost og AutoGluon for prediksjon av strømproduksjon fra solceller.'
      - 'Oppnådde beste modellytelse med AutoGluon – resulterte i karakter B.'
      - 'Bearbeidet og analyserte værdata som grunnlag for modellene.'

  - name: 'Anvendt Data Science – Prediksjon av strømforbruk (TDT4259)'
    location: 'NTNU, Trondheim'
    duration: '2023'
    description: >
      Teamarbeid med utvikling av modeller for prediksjon av strømforbruk i 5 nordiske byer.
    achievements:
      - 'Utviklet og evaluerte maskinlæringsmodeller i Python for prediksjon av strømforbruk.'
      - 'Jobbet med datarensing, feature engineering og analyse av tidsseriedata.'
      - 'Presenterte funn og innsikt fra data med vekt på praktisk forretningsverdi.'

  - name: 'Datavarehus og datagruvedrift (TDT4300)'
    location: 'NTNU, Trondheim'
    duration: '2023'
    description: >
      Fordypning i datakvalitet, preprosessering og analysemetoder på store datasett.
    achievements:
      - 'Anvendte klassifisering (k-NN, Decision Tree), klynging (k-means, DBSCAN) og mønstergjenkjenning (Apriori) på reelle datasett.'
      - 'Arbeidet med datakvalitet og preprosessering som grunnlag for analyse.'

  - name: 'Datamodellering og databasesystemer (TDT4145)'
    location: 'NTNU, Trondheim'
    duration: '2022'
    description: >
      Prosjekt med utvikling av en databaseapplikasjon for kaffesmaking – brukere kunne skrive
      og lese anmeldelser av ulike kaffevarianter.
    achievements:
      - 'Modellerte og implementerte relasjonsdatabase for kaffeanmeldelser med normalisering og spørringsoptimalisering.'
      - 'Utviklet applikasjon med støtte for brukerregistrering, sortering og filtrering av anmeldelser.'

